apiVersion: v1
kind: Service
metadata:
  name: notionx-frontend-service
  labels:
    app: notionx-frontend
spec:
  type: NodePort # Exposes the service on a static port on the EC2 host.
               # This will be the port you access from your browser.
  selector:
    app: notionx-frontend
  ports:
    - protocol: TCP
      port: 80       # Port the service listens on inside the cluster
      targetPort: 3000 # Port the container is actually running on (as defined in Dockerfile)