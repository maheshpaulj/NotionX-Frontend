# k8s/deployment.yaml (FINAL VERSION)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notionx-frontend-deployment
spec:
  replicas: 1 # Start with 1, can be scaled later
  selector:
    matchLabels:
      app: notionx-frontend
  template:
    metadata:
      labels:
        app: notionx-frontend
    spec:
      imagePullSecrets:
        - name: ecr-secret 
      containers:
      - name: notionx-frontend
        image: __IMAGE_URL__:__IMAGE_TAG__ # Jenkins will replace this
        ports:
        - containerPort: 3001 # Your app runs on port 3000 inside the container
        envFrom:
          - secretRef:
              name: notionx-secrets
        env:
        - name: PORT
          value: "3001"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5