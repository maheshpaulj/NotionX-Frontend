# /notionx-frontend/.github/workflows/deploy.yml
name: Deploy Frontend to EKS

on:
  push:
    branches: ["master"]

env:
  ECR_REPOSITORY: notionx-frontend
  
jobs:
  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
    
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, Tag, and Push Docker Image
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
        # These are now passed directly to the docker build command below
        LIVEBLOCKS_PRIVATE_KEY: ${{ secrets.LIVEBLOCKS_PRIVATE_KEY }}
        EDGE_STORE_ACCESS_KEY: ${{ secrets.EDGE_STORE_ACCESS_KEY }}
        EDGE_STORE_SECRET_KEY: ${{ secrets.EDGE_STORE_SECRET_KEY }}
        # Add Clerk and any other NEXT_PUBLIC_ variables here if they are needed at BUILD time
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      run: |
        DOCKER_BUILDKIT=1 docker build \
          --secret id=dotenv,env=LIVEBLOCKS_PRIVATE_KEY \
          --secret id=dotenv,env=EDGE_STORE_ACCESS_KEY \
          --secret id=dotenv,env=EDGE_STORE_SECRET_KEY \
          --secret id=dotenv,env=NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Deploy to Amazon EKS
      run: |
        aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}
        # Important: Check that the path to your deployment file is correct
        sed -i 's|image: .*|image: ${{ steps.build-image.outputs.image }}|' k8s/deployment.yaml
        kubectl apply -f k8s/