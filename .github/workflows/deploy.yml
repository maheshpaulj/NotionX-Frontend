# /notionx-frontend/.github/workflows/deploy.yml
name: Deploy Frontend to EKS

on:
  push:
    branches: ["master"]

env:
  ECR_REPOSITORY: notionx-frontend
  
jobs:
  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # We no longer need a 'Create .env file' step.
    
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, Tag, and Push Docker Image
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
        # --- DEFINE THE SECRETS AS ENVIRONMENT VARIABLES FOR THE DOCKER COMMAND ---
        LIVEBLOCKS_PRIVATE_KEY: ${{ secrets.LIVEBLOCKS_PRIVATE_KEY }}
        EDGE_STORE_ACCESS_KEY: ${{ secrets.EDGE_STORE_ACCESS_KEY }}
        EDGE_STORE_SECRET_KEY: ${{ secrets.EDGE_STORE_SECRET_KEY }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}"
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}"
        FIREBASE_SERVICE_KEY: ${{ secrets.FIREBASE_SERVICE_KEY }}"
      run: |
        # Use Docker BuildKit's --secret flag to mount the secrets
        # The secret 'id' MUST match the one in the Dockerfile
        # Note the DOCKER_BUILDKIT=1 to enable this feature
        DOCKER_BUILDKIT=1 docker build \
          --secret id=dotenv,env=LIVEBLOCKS_PRIVATE_KEY \
          --secret id=dotenv,env=EDGE_STORE_ACCESS_KEY \
          --secret id=dotenv,env=NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY \
          --secret id=dotenv,env=AWS_ACCESS_KEY_ID \
          --secret id=dotenv,env=FIREBASE_SERVICE_KEY \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Deploy to Amazon EKS
      # ... (This step remains the same)
      run: |
        aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}
        sed -i 's|image: .*|image: ${{ steps.build-image.outputs.image }}|' ks/deployment.yaml
        kubectl apply -f ks/